<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADHANA | Register</title>
    <link rel="stylesheet" href="/static/register.css">
</head>

<body>
<div class="register-page">
        <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>
        <div class="register-container">
            <div class="register-logo">SADHANA</div>
            <p class="register-tag">DISCIPLINE • LEARNING • GROWTH</p>

         <div class="register-box">
               <div class="register-heading">
                    <h1>Create Account</h1>
                    <p>Hare Krishna</p>
                </div>

               <form method="post" action="{{ url_for('register')}}">
                    <div class="input-group">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                 </div>

                    <div class="input-group">
                        <label for="studentid">Create Student ID</label>
                        <input type="text" id="studentid" name="studentid" placeholder="Create Student ID" required>
                 </div>

                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                    <div class="input-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
                   </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="password-box">
                            <input type="password" id="password" name="password" placeholder="Create a password" required>
                            <button type="button" id="togglePassword">👁</button>
                        </div>
                </div>

                    <div class="input-group">
                        <label for="confirm-password">Confirm Password</label>
                        <div class="password-box">
                            <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required>
                            <button type="button" id="toggleConfirmPassword">👁</button>
                        </div>
                 </div>

                    <label class="terms">
                        <input type="checkbox" name="terms" required>
                        <span>I agree to the <a href="#">Terms & Conditions</a></span>
                    </label>

                    <button type="submit" class="register-button">CREATE ACCOUNT</button>
              </form>

                <div class="login-section">
                    <p>Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
                </div>
             <div class="back-home">
                    <a href="{{ url_for('home') }}">← Back to Home</a>
        </div>
 </div>
</div>
</div>

    <script>
        const password = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");

    togglePassword.addEventListener("click", function () {
        if (password.type === "password") {
            password.type = "text";
            togglePassword.textContent = "🙈";
        } else {
            password.type = "password";
            togglePassword.textContent = "👁";
        }
    });

        const confirmPassword = document.getElementById("confirm-password");
        const toggleConfirmPassword = document.getElementById("toggleConfirmPassword");

    toggleConfirmPassword.addEventListener("click", function () {
        if (confirmPassword.type === "password") {
            confirmPassword.type = "text";
            toggleConfirmPassword.textContent = "🙈";
        } else {
            confirmPassword.type = "password";
            toggleConfirmPassword.textContent = "👁";
        }
    });
    </script>
</body>

</html>
